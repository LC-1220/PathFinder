<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Temporary Password | PathFinder</title>
  <style>
    :root { color-scheme: light; font-family: "DM Sans", "Segoe UI", sans-serif; color: #2b2020; background: #f7f4f4; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #f5eeee, #faf8f8); }
    main { width: min(100%, 440px); padding: 32px; border: 1px solid #e6dada; border-radius: 8px; background: #fff; box-shadow: 0 18px 45px rgba(80, 0, 0, .08); }
    .eyebrow { color: #800000; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 8px 0; font: 700 25px "Space Grotesk", "Segoe UI", sans-serif; }
    p { margin: 0 0 22px; color: #6b6262; font-size: 14px; line-height: 1.5; }
    label { display: block; margin: 14px 0 6px; color: #483b3b; font-size: 12px; font-weight: 700; }
    input { width: 100%; height: 42px; padding: 0 12px; border: 1px solid #d8cece; border-radius: 4px; font: inherit; }
    input:focus { outline: 2px solid rgba(128, 0, 0, .18); border-color: #800000; }
    button { width: 100%; min-height: 42px; margin-top: 20px; border: 0; border-radius: 4px; background: #800000; color: #fff; font: 700 14px "DM Sans", "Segoe UI", sans-serif; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    #password-status { min-height: 20px; margin-top: 12px; color: #800000; font-size: 13px; }
    #password-status.is-error { color: #b42318; }
    .logout { display: block; margin-top: 18px; color: #6b6262; text-align: center; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">PathFinder · Account security</span>
    <h1>Change your temporary password</h1>
    <p>Hi {{ name }}. Set a new password before continuing to the admin dashboard.</p>
    <p class="password-policy">Use at least 8 characters, including an uppercase letter and a symbol. Maximum 72 UTF-8 bytes.</p>
    <form id="first-password-form">
      <label for="temporary-password">Temporary password</label>
      <input id="temporary-password" name="current_password" type="password" autocomplete="current-password" required>
      <label for="new-password">New password</label>
      <input id="new-password" name="new_password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" name="confirm_password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
      <button type="submit">Update password</button>
      <div id="password-status" role="status" aria-live="polite"></div>
    </form>
    <a class="logout" href="/admin/logout">Sign out</a>
  </main>
  <script>
    const form = document.getElementById('first-password-form');
    const status = document.getElementById('password-status');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.classList.remove('is-error');
      status.textContent = 'Updating password...';
      const values = Object.fromEntries(new FormData(form).entries());
      try {
        const response = await fetch('/api/v1/admin/change_password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(values)
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Could not update password.');
        window.location.replace('/admin/dashboard');
      } catch (error) {
        status.textContent = error.message || 'Could not update password.';
        status.classList.add('is-error');
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
